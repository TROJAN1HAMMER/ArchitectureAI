services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: architectai-postgres
    restart: always
    environment:
      POSTGRES_USER: architect_user
      POSTGRES_PASSWORD: architect_password
      POSTGRES_DB: architectai_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - architectai-network

  redis:
    image: redis:7-alpine
    container_name: architectai-redis
    restart: always
    ports:
      - '6379:6379'
    networks:
      - architectai-network

volumes:
  postgres_data:

networks:
  architectai-network:
    driver: bridge
